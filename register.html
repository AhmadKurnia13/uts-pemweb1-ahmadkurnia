<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrasi | PT NusaCyber Tech Indonesia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="mesh-glow mesh-blue"></div>
  <div class="mesh-glow mesh-violet"></div>

  <nav class="navbar navbar-dark navbar-glass py-3">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
        <span class="brand-mark"><i class="bi bi-shield-lock-fill text-white"></i></span>
        <span>NusaCyber <span class="text-slate fw-medium">Tech</span></span>
      </a>
      <a href="index.html" class="btn btn-exec-glass btn-sm rounded-pill px-3">
        <i class="bi bi-arrow-left me-1"></i>Kembali ke Beranda
      </a>
    </div>
  </nav>

  <main class="d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
          <div class="glass-card p-4 p-md-5">
            <div class="text-center mb-4">
              <div class="icon-box mx-auto mb-3"><i class="bi bi-person-plus"></i></div>
              <h3 class="fw-bold mb-1">Registrasi Anggota</h3>
              <p class="text-slate small mb-0">Buat kredensial akses untuk Portal NusaCyber Tech</p>
            </div>

            <div id="pesan-register"></div>

            <form onsubmit="return prosesRegistrasi(event)">
              <div class="mb-3">
                <label for="reg-nama" class="form-label small fw-semibold text-slate">Nama Lengkap</label>
                <input type="text" class="form-control form-control-dark" id="reg-nama" placeholder="Contoh: Ahmad Kurnia" />
              </div>
              <div class="mb-3">
                <label for="reg-email" class="form-label small fw-semibold text-slate">Email Korporasi / Pribadi</label>
                <input type="email" class="form-control form-control-dark" id="reg-email" placeholder="nama@nusacyber.co.id" />
              </div>
              <div class="mb-3">
                <label for="reg-username" class="form-label small fw-semibold text-slate">Username</label>
                <input type="text" class="form-control form-control-dark" id="reg-username" placeholder="Buat username unik" />
              </div>
              <div class="row g-3 mb-2">
                <div class="col-sm-6">
                  <label for="reg-password" class="form-label small fw-semibold text-slate">Password</label>
                  <input type="password" class="form-control form-control-dark" id="reg-password" oninput="cekKekuatanPassword()" placeholder="Min. 6 karakter" />
                </div>
                <div class="col-sm-6">
                  <label for="reg-konfirmasi" class="form-label small fw-semibold text-slate">Konfirmasi Password</label>
                  <input type="password" class="form-control form-control-dark" id="reg-konfirmasi" placeholder="Ulangi password" />
                </div>
              </div>
              <div class="mb-4">
                <div class="progress bg-white bg-opacity-10" style="height: 5px;">
                  <div id="strength-bar" class="progress-bar" style="width: 0%;"></div>
                </div>
                <small id="strength-label" class="text-slate" style="font-size: 0.74rem;"></small>
              </div>
              <button type="submit" class="btn btn-exec-primary btn-lg w-100 rounded-pill fs-6">
                <i class="bi bi-check2-circle me-2"></i>Daftar Sekarang
              </button>
            </form>

            <p class="text-center text-slate small mt-4 mb-0">
              Sudah punya akun? <a href="login.html" class="text-info fw-semibold text-decoration-none">Login di sini</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer-glass py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-0 small fw-semibold">@Copyright by 24552011297_AHMAD KURNIA_TIF RP 24E CNS</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
