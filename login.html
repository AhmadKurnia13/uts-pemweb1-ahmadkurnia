<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | PT NusaCyber Tech Indonesia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="mesh-glow mesh-blue"></div>
  <div class="mesh-glow mesh-violet"></div>

  <nav class="navbar navbar-dark navbar-glass py-3">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
        <span class="brand-mark"><i class="bi bi-shield-lock-fill text-white"></i></span>
        <span>NusaCyber <span class="text-slate fw-medium">Tech</span></span>
      </a>
      <a href="index.html" class="btn btn-exec-glass btn-sm rounded-pill px-3">
        <i class="bi bi-arrow-left me-1"></i>Kembali ke Beranda
      </a>
    </div>
  </nav>

  <main class="d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
          <div class="glass-card p-4 p-md-5">
            <div class="text-center mb-4">
              <div class="icon-box mx-auto mb-3"><i class="bi bi-fingerprint"></i></div>
              <h3 class="fw-bold mb-1">Portal Autentikasi</h3>
              <p class="text-slate small mb-0">Masuk untuk mengakses Menu Utama NusaCyber Tech</p>
            </div>

            <div id="pesan-login"></div>

            <form onsubmit="return validasiLogin(event)">
              <div class="mb-3">
                <label for="login-username" class="form-label small fw-semibold text-slate">Username atau Email</label>
                <input type="text" class="form-control form-control-dark" id="login-username" placeholder="Masukkan username (ahmad)" />
              </div>
              <div class="mb-4">
                <label for="login-password" class="form-label small fw-semibold text-slate">Password</label>
                <div class="input-group">
                  <input type="password" class="form-control form-control-dark" id="login-password" placeholder="Masukkan password (24552011297)" />
                  <button type="button" class="btn btn-exec-glass" onclick="togglePassword('login-password', 'eye-login')">
                    <i class="bi bi-eye" id="eye-login"></i>
                  </button>
                </div>
              </div>
              <button type="submit" class="btn btn-exec-primary btn-lg w-100 rounded-pill fs-6 mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i>Masuk ke Menu Utama
              </button>
            </form>

            <div class="p-3 rounded-3 bg-white bg-opacity-5 border border-white border-opacity-10 d-flex justify-content-between align-items-center gap-2">
              <div class="small text-slate">
                Demo: <code class="text-info">ahmad</code> / <code class="text-info">24552011297</code>
              </div>
              <button type="button" onclick="isiAkunDemo()" class="btn btn-exec-glass btn-sm rounded-pill px-3" style="font-size:0.75rem;">
                Isi Otomatis
              </button>
            </div>

            <p class="text-center text-slate small mt-4 mb-0">
              Belum memiliki akun? <a href="register.html" class="text-info fw-semibold text-decoration-none">Registrasi di sini</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer-glass py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-0 small fw-semibold">@Copyright by 24552011297_AHMAD KURNIA_TIF RP 24E CNS</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
